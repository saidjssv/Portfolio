<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <script src="https://kit.fontawesome.com/410cd40949.js" crossorigin="anonymous"></script>
    <!-- Estilos CSS -->
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/background.css" />
    <link rel="stylesheet" href="css/nav.css" />
  </head>
  <body>
    <!-- Contenedor para la barra de navegación dinámica -->
    <div id="navbar"></div>

    <!-- Cursor -->
     <div class="cursor"></div>

    <!-- Contenido principal -->
    <main>
      <!-- Espacio para el contenido principal -->
      <section id="top">
        <h1>Hi! I'm Said</h1>
        <p>Here, I want to tell you about myself, my future/current projects, skills, etc.</p>
      </section>
    </main>

    <!-- Scripts -->
    <script>
      /**
       * Carga dinámicamente la barra de navegación
       */
      fetch("nav.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;
          document.dispatchEvent(new Event("nav:loaded"));
        })
        .catch((error) => console.error("Error cargando nav.html:", error));
    </script>
    <script src="js/script.js"></script>
  </body>
</html>
