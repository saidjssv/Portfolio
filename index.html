<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <script src="https://kit.fontawesome.com/410cd40949.js" crossorigin="anonymous"></script>
    <!-- Estilos CSS -->
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/background.css" />
    <link rel="stylesheet" href="css/nav.css" />
    <!-- Fondos de google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ephesis&display=swap" rel="stylesheet">

  </head>
  <body>
    <!-- Contenedor para la barra de navegación dinámica -->
    <div id="navbar"></div>

    <!-- Cursor -->
     <div class="cursor"></div>

    <!-- Contenido principal -->
    <main>
      <!-- Espacio para el contenido principal -->
      <section id="top" class="top-section">
        <h1>Hi! I'm Said</h1>
        <div class="content-row">
          <p>Here, I want to tell you<br> about myself,<br> my future/current projects,<br>skills, etc.</p>
          <img src="imgs/icon.webp" alt="icon">
        </div>
        <a href="about.html">Want to know about me?<i class="fa-solid fa-arrow-right"></i></a>
      </section>
    </main>

    <!-- Scripts -->
    <script>
      /**
       * Carga dinámicamente la barra de navegación
       */
      fetch("nav.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;
          document.dispatchEvent(new Event("nav:loaded"));
        })
        .catch((error) => console.error("Error cargando nav.html:", error));
    </script>
    <script src="js/script.js"></script>
  </body>
</html>
